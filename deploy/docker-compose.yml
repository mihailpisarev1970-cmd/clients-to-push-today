# Unique Compose project name: prevents interference with other projects
# whose compose files also live in a directory named 'deploy'.
name: perfect-pullup


services:
  perfect_pull-up:
    build: ..
    container_name: perfect_pull-up
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
